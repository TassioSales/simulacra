name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Vet
        run: go vet ./...
      - name: Testes com detector de corridas
        run: go test -race -short ./...
      - name: Testes completos (inclui o bug raro)
        run: go test ./...
      - name: Campanha de fumaça contra o Raft correto
        run: go run ./cmd/simulacra run -seeds 2000 -crash 1 -partition 1
